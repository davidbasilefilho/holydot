name: Stable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: holydot-stable-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'davidbasilefilho/holydot' && !github.event.deleted && !github.event.repository.fork && !contains(github.ref_name, '-') && !contains(github.ref_name, '+')
    uses: ./.github/workflows/validation.yml
    permissions:
      contents: read

  release:
    needs: validate
    # Explicitly exclude dev/prerelease/build tags even if a user pushes one.
    # The script additionally requires exact v{package.version} stable SemVer.
    if: github.repository == 'davidbasilefilho/holydot' && !github.event.deleted && !github.event.repository.fork && !contains(github.ref_name, '-') && !contains(github.ref_name, '+')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Publish matching npm latest and GitHub stable release
        run: bun run release:stable
        env:
          GH_TOKEN: ${{ github.token }}
