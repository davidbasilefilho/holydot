name: Development release

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

permissions:
  contents: read

# Serialize publications across branches; never cancel a half-published version.
concurrency:
  group: holydot-dev-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'davidbasilefilho/holydot' && !github.event.deleted && !github.event.repository.fork
    uses: ./.github/workflows/validation.yml
    permissions:
      contents: read

  release:
    needs: validate
    if: github.repository == 'davidbasilefilho/holydot' && !github.event.deleted && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Publish matching npm dev and GitHub prerelease
        run: bun run release:dev
        env:
          GH_TOKEN: ${{ github.token }}
