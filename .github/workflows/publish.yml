name: Publish

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]

permissions:
  contents: read

# Checkpoint branches (codex/**, work/**, feature/**) never enter publication.
# A push to the release branches or a version tag still requires owner authorization.
concurrency:
  group: holydot-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'davidbasilefilho/holydot' && !github.event.deleted && !github.event.repository.fork && !contains(github.ref_name, '-dev-') && !contains(github.ref_name, '+')
    uses: ./.github/workflows/validation.yml
    permissions:
      contents: read

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Publish dev from a release branch
        if: startsWith(github.ref, 'refs/heads/')
        run: bun run release:dev
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish stable product version from its exact tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bun run release:stable
        env:
          GH_TOKEN: ${{ github.token }}
